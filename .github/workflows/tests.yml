name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-web:
    name: API and web (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run API and web tests
        run: ./gradlew apiTest webTest -Dweb.browser=chrome -Dweb.headless=true --console=plain

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport --clean --console=plain

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report
          if-no-files-found: ignore
          retention-days: 14

  web-smoke:
    name: Web smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run web smoke tests
        run: ./gradlew webSmokeTest -Dweb.browser=${{ matrix.browser }} -Dweb.headless=true --console=plain

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport --clean --console=plain

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.browser }}
          path: build/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke-${{ matrix.browser }}
          path: build/reports/allure-report
          if-no-files-found: ignore
          retention-days: 14
